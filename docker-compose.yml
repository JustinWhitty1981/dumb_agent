version: '3.8'

services:
  langchain-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-agent
    ports:
      - "4545:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-/models/Qwen3.5-9B-AWQ}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-a84d585b-574d-4eb7-be2a-eaea93ef7b1f}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - SEGMENT=${SEGMENT:-ent}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - TZ=America/Chicago
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/memory_store:/app/memory_store
    restart: unless-stopped
